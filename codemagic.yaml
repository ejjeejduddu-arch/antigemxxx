workflows:
  android-build:
    name: Build AntiGem Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 21
    scripts:
      - name: Build AntiGem APKs
        script: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh
    artifacts:
      - output/*.apk
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - hhshdhyyeyyr@gmail.com
        notify:
          success: true
          failure: true
